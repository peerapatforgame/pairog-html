    <TITLE>การกำหนดสีตัวอักษรทั้งเอกสาร</TITLE>
    </HEAD>
    <BODY TEXT="##990000">
    คนคนดี มีมุขเย็น เห็นกันทั่ว<BR>
    คนคนชั่ว คนเลว จะหลงไหล<BR>
    คนคนดี มีคุณ อบอุ่นใจ<BR>
    คนจัญไร คนค้า พาเป็นพาล<BR>
